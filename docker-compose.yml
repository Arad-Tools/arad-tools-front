services:
  frontend:
    image: ghcr.io/arad-tools/arad-tools-front:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # Public URL for the frontend / browser and asset resolution
      NEXT_PUBLIC_API_URL: https://api.aradtoolsco.ir/api
      # Internal Docker service URL for server-side SSR fetches
      INTERNAL_API_URL: http://backend:8000/api
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: arad-network
